# AirSense MX — CloudFormation Parameters (Example)
#
# NOTA: Este archivo es un ejemplo. El archivo real (parameters.yaml)
# NO debe versionarse en git porque contiene secretos.
#
# Copiar a infra/parameters.yaml y ajustar valores:
#   cp infra/parameters.example.yaml infra/parameters.yaml
#   # Editar con valores reales
#   echo "parameters.yaml" >> .gitignore  # Asegurar que no se versionea

prod:
  Environment: prod
  AppName: airsense-mx
  InstanceType: t3.small
  KeyName: airsense-ec2-key-prod
  VpcId: vpc-0123456789abcdef0
  SubnetIds:
    - subnet-0123456789abcdef0
    - subnet-0123456789abcdef1

dev:
  Environment: dev
  AppName: airsense-mx
  InstanceType: t3.micro
  KeyName: airsense-ec2-key-dev
  VpcId: vpc-0123456789abcdef0
  SubnetIds:
    - subnet-0123456789abcdef0
    - subnet-0123456789abcdef1
